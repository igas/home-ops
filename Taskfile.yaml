---
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.ROOT_DIR}}/age.key'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap
  talos: .taskfiles/talos
  template: .taskfiles/template

tasks:

  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux

  github-status-token:
    desc: Check and rotate the GitHub token Flux uses for commit statuses
    interactive: true
    cmd: '{{.SCRIPTS_DIR}}/github-status-token.sh'
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux op

  flux-mcp:
    desc: Port-forward the read-only Flux MCP server to localhost:9090 for Claude Code
    cmd: kubectl --namespace flux-system port-forward service/flux-operator-mcp 9090:9090
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

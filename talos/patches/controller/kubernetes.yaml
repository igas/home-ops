# Talos 1.14 multi-document Kubernetes config. talhelper emits these kinds for
# the 1.14 contract, so the matching v1alpha1 fields (cluster.apiServer,
# controllerManager, scheduler, proxy) are rejected as "already set".
# KubeClusterConfig is deliberately not used: siderolabs/talos#14338 panics
# machined on a bootstrapped cluster.
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
# talhelper 3.1.17 (Talos machinery 1.14.0-alpha.2) drops talconfig's
# additionalApiServerCertSans from this document, so repeat them here.
certExtraSANs:
  - 127.0.0.1
  - k8s.igas.dev
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: "true"
  # Pinned so the service account issuer stops tracking
  # cluster.controlPlane.endpoint. Talos derives --service-account-issuer and
  # --api-audiences from the endpoint, and neither flag is on kube-apiserver's
  # merge denylist, so extraArgs overwrite the derived value (the default merge
  # policy is overwrite, and a value list renders one --flag=value per entry).
  # The first entry is the issuer new tokens are signed with and stays at the
  # pre-move endpoint; the rest are only accepted for verification. That is what
  # left the endpoint free to move to k8s.igas.dev with every in-cluster token
  # still valid. docs/runbooks/talos-control-plane-endpoint.md has the phased
  # issuer move and what has to change with these two lists.
  service-account-issuer: &issuers
    - https://192.168.6.1:6443
    - https://k8s.igas.dev:6443
  api-audiences: *issuers
---
# Drop the default PodSecurity admission configuration
# (was cluster.apiServer.admissionControl: $patch: delete).
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$$patch: delete
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# Cilium replaces kube-proxy.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# talhelper 3.1.17 renders this document from the alpha.2 generator, which names
# the secretbox key "key1" and omits the identity provider. Deleting it here
# lets kube-etcd-encryption.yaml re-add the live shape (lists append on merge,
# and one patch file may touch a document only once).
apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
$$patch: delete

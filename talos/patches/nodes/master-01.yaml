---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
hardwareAddr: 0e:70:84:42:a5:c5
links:
  - eno1
bondMode: active-backup
up: true
addresses:
    - address: 192.168.6.1/20
routes:
    - gateway: 192.168.1.1
---
# The onboard I219 (e1000e) hangs with "Detected Hardware Unit Hang" under
# TSO, which took the node off the network on Talos v1.14.3 (#848).
apiVersion: v1alpha1
kind: EthernetConfig
name: eno1
features:
  tx-tcp-segmentation: false
  tx-tcp6-segmentation: false

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: woodpecker-secret
    template:
      data:
        WOODPECKER_GITHUB_CLIENT: "{{ .GITHUB_CLIENT }}"
        WOODPECKER_GITHUB_SECRET: "{{ .GITHUB_SECRET }}"
        WOODPECKER_AGENT_SECRET: "{{ .AGENT_SECRET }}"
        WOODPECKER_GRPC_SECRET: "{{ .GRPC_SECRET }}"
  dataFrom:
    - extract:
        key: woodpecker
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: woodpecker-agent-secret
    template:
      data:
        WOODPECKER_AGENT_SECRET: "{{ .AGENT_SECRET }}"
  dataFrom:
    - extract:
        key: woodpecker
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: woodpecker-database-secret
    template:
      data:
        # libpq keyword syntax, with backslashes and quotes escaped in the password.
        WOODPECKER_DATABASE_DATASOURCE: >-
          host=postgres-18-rw.database.svc.cluster.local port=5432 dbname=woodpecker user=woodpecker password='{{ .POSTGRES_PASSWORD | replace "\\" "\\\\" | replace "'" "\\'" }}' sslmode=require
        PGHOST: postgres-18-rw.database.svc.cluster.local
        PGPORT: "5432"
        PGDATABASE: woodpecker
        PGUSER: woodpecker
        PGPASSWORD: "{{ .POSTGRES_PASSWORD }}"
        PGSSLMODE: require
        INIT_POSTGRES_HOST: postgres-18-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: woodpecker
        INIT_POSTGRES_USER: woodpecker
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: woodpecker
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-db-init
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: woodpecker-db-init-secret
    template:
      data:
        INIT_POSTGRES_SUPER_PASS: "{{ .credential }}"
  dataFrom:
    - extract:
        key: cloudnative-pg

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-lb
  labels:
    igas.dev/lb-pool: bgp
  annotations:
    external-dns.kubernetes.io/hostname: postgres.igas.dev
    lbipam.cilium.io/ips: 192.168.100.125
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres-18
    role: primary

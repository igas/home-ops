---
apiVersion: v1
kind: LimitRange
metadata:
  name: woodpecker-builds
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "2"
        memory: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: woodpecker-builds
spec:
  hard:
    # Allows four test containers plus four service containers at the defaults.
    limits.cpu: "16"
    limits.memory: 32Gi
    requests.cpu: "8"
    requests.memory: 16Gi
    pods: "24"
    persistentvolumeclaims: "4"
    requests.storage: 40Gi
    services: "24"
    secrets: "64"

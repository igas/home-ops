---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 1h
  # Rook v1.20 dropped CSI driver management from the rook-ceph chart. This chart
  # takes over the OperatorConfig and the two Driver CRs the v1.19 operator wrote;
  # the ceph-csi-operator controller itself still ships with the rook-ceph chart.
  #
  # The baseline here is Rook's own recommended values file, which the drivers are
  # documented as requiring (the chart's bare defaults do not work with Rook):
  # https://github.com/rook/rook/blob/v1.20.7/deploy/charts/ceph-csi-drivers/values.yaml
  # That file covers the namespace, the imageSet, the priority classes and the four
  # prefixed driver names. Everything beyond it is here to reproduce what is running
  # today, so helm adoption does not rewrite the live Driver specs.
  values:
    # cephConnections and clientProfiles stay unset: Rook owns the CephConnection
    # and ClientProfile CRs (that is where cephClusterSpec.csi settings land).
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        clusterName: rook-ceph
        imageSet:
          # Written by the Rook operator from the csi.* image tags in the rook-ceph chart.
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            # Chart default is on, which adds a log-rotator sidecar and a hostPath.
            # The live Driver CRs have no rotation block.
            enabled: false
        controllerPlugin:
          # Rook set Recreate; the ctrlplugin pods hold CSI leader-election leases.
          deploymentStrategy:
            type: Recreate
          # Rook wrote these two the wrong way round for CephFS (ctrlplugin on
          # system-node-critical, nodeplugin on system-cluster-critical). One
          # default for both drivers fixes that; the CephFS pods restart once.
          priorityClassName: system-cluster-critical
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            omapGenerator:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                memory: 512Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
        nodePlugin:
          priorityClassName: system-node-critical
          resources:
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            registrar:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
    drivers:
      # Driver names carry the Rook namespace prefix, which is what the live
      # CSIDriver objects and every provisioned PV already reference.
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        # Chart defaults are grpcTimeout 30, replicas 1 and log rotation on; the live
        # drivers run Rook's 150s timeout and two controller replicas.
        grpcTimeout: 150
        # Must be set. Rook's recommended values leave this at the chart default of
        # none for RBD, and the operator only runs a csi-snapshotter when the policy
        # is not none (driver_controller.go, v1.0.5) - that would take out the
        # csi-ceph-blockpool VolumeSnapshotClass and every VolSync RBD snapshot.
        # volumeSnapshot, not volumeGroupSnapshot: an unset policy resolves to
        # volumeSnapshot, which is what the live RBD driver runs (its csi-snapshotter
        # carries no CSIVolumeGroupSnapshot feature gate).
        snapshotPolicy: volumeSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      # There is no CephFilesystem yet (cephFileSystems is empty), but the CephFS
      # driver pods have been running since the cluster was built. Disabling it here
      # would tear them down, so keep it on until the driver is retired deliberately.
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        grpcTimeout: 150
        # Unlike RBD, the live CephFS snapshotter does carry the
        # CSIVolumeGroupSnapshot feature gate.
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      # No CephNFS and no NVMe-oF gateway on this cluster; neither driver has ever run.
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com

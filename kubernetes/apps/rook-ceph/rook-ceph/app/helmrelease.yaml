---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    csi:
      # v1.20 left only the CSI image tags, installCsiOperator and this
      # ServiceMonitor here. The driver toggles and cephFSKernelMountOptions moved
      # out: the drivers themselves to the ceph-csi-drivers HelmRelease, the kernel
      # mount options to cephClusterSpec.csi in the cluster HelmRelease. The chart
      # has no values schema, so leftovers of the old keys are silently ignored.
      serviceMonitor:
        enabled: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangeable
        cpu: 100m # unchangeable
      limits: {}

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  # A Ceph image change rolls mons, mgrs and OSDs one at a time and the chart's
  # health check on the CephCluster stays InProgress until that finishes. The
  # default 5m timeout fails the upgrade and Flux rolls the CephCluster spec back
  # mid-upgrade (seen 2026-09-13 on #720). A Ceph major (Squid -> Tentacle, #733)
  # rolls the same daemons but converts on-disk state as it goes, so allow more
  # than the ~25m a patch bump took.
  timeout: 45m
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.igas.dev
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    # Pin Ceph explicitly. The chart derives cephVersion and the toolbox image from
    # cephImage, and a chart bump can otherwise carry a Ceph major on its own (the
    # v1.20 chart defaulted to v20 while this cluster still ran v19).
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v21.1.0
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      # CVE-2025-30156 cephx rotation left the CSI and rbd-mirror keys on aes
      # (aes256k kernel mounts need Linux 7.0+; Talos ships 6.18). These four
      # warnings would otherwise hold Ceph at HEALTH_WARN and block tuppr's
      # TalosUpgrade health gate. See onedr0p/home-ops#11552.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
      csi:
        cephfs:
          # Was csi.cephFSKernelMountOptions on the operator chart before v1.20.
          # Rook writes it into the ClientProfile the CephFS driver reads.
          kernelMountOptions: ms_mode=prefer-crc
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      mgr:
        modules:
          # - name: diskprediction_local
          #   enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        addressRanges:
          public:
            - 192.168.6.0/24
          cluster:
            - 192.168.6.0/24
        connections:
          requireMsgr2: true
      resources:
        osd:
          limits:
            memory: 8Gi
      security:
        cephx:
          # CVE-2025-30156: rotate mon/mgr/osd/admin keys to aes256k once Ceph >= v19.2.6.
          # Bump keyGeneration to rotate again.
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # aes256k kernel mounts need Linux 7.0+; Talos ships 6.18.
          csi:
            keyType: aes
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          osdsPerDevice: "1"
        nodes:
          - name: k8s-master-02
            devices:
              - name: /dev/disk/by-id/nvme-Samsung_SSD_970_EVO_Plus_1TB_S4EWNX0W419279P
          - name: k8s-master-03
            devices:
              - name: /dev/disk/by-id/ata-Samsung_Portable_SSD_T1_1TB_S25ENYAG700023A
          - name: k8s-worker-02
            devices:
              - name: /dev/disk/by-id/ata-CT2000MX500SSD1_2435E989E9AF
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems: []
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores: []

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ru-radarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ru-radarr-secret
    template:
      data:
        RADARR__AUTH__APIKEY: "{{ .RADARR_APIKEY }}"
        RADARR__POSTGRES__HOST: postgres-18-rw.database.svc.cluster.local
        RADARR__POSTGRES__PORT: "5432"
        RADARR__POSTGRES__USER: ru-radarr
        RADARR__POSTGRES__PASSWORD: "{{ .POSTGRES_PASS }}"
        RADARR__POSTGRES__MAINDB: ru-radarr-main
        RADARR__POSTGRES__LOGDB: ru-radarr-log
        INIT_POSTGRES_DBNAME: ru-radarr-main ru-radarr-log
        INIT_POSTGRES_HOST: postgres-18-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: ru-radarr
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: ru-radarr
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ru-radarr-db-init
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ru-radarr-db-init-secret
    template:
      data:
        INIT_POSTGRES_SUPER_PASS: "{{ .credential }}"
  dataFrom:
    - extract:
        key: cloudnative-pg

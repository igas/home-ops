---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ru-radarr
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/ru-radarr/app
  # Start with an empty volume, even if backups from the old instance exist.
  patches:
    - target:
        kind: PersistentVolumeClaim
      patch: |-
        - op: remove
          path: /spec/dataSourceRef
    - patch: |-
        $patch: delete
        apiVersion: volsync.backube/v1alpha1
        kind: ReplicationDestination
        metadata:
          name: ${APP}-dst
  postBuild:
    substitute:
      APP: ru-radarr
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_SCHEDULE: "0 22 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false

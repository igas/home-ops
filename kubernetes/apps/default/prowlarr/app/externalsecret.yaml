---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prowlarr-secret
    template:
      data:
        PROWLARR__AUTH__APIKEY: "{{ .PROWLARR__AUTH__APIKEY }}"
        PROWLARR__POSTGRES__HOST: postgres-18-rw.database.svc.cluster.local
        PROWLARR__POSTGRES__PORT: "5432"
        PROWLARR__POSTGRES__USER: prowlarr
        PROWLARR__POSTGRES__PASSWORD: "{{ .PROWLARR__POSTGRES_PASSWORD }}"
        PROWLARR__POSTGRES__MAINDB: prowlarr-main
        PROWLARR__POSTGRES__LOGDB: prowlarr-log
        INIT_POSTGRES_DBNAME: prowlarr-main prowlarr-log
        INIT_POSTGRES_HOST: postgres-18-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: prowlarr
        INIT_POSTGRES_PASS: "{{ .PROWLARR__POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: prowlarr
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-db-init
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prowlarr-db-init-secret
    template:
      data:
        INIT_POSTGRES_SUPER_PASS: "{{ .credential }}"
  dataFrom:
    - extract:
        key: cloudnative-pg

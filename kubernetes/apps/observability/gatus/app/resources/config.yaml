---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  # Direct LoadBalancer IP checks complement the sidecar's hostname checks.
  # Gatus runs in-cluster; task check-lb remains the LAN routing check.
  # The services group uses the existing GatusEndpointDown alert (for: 5m).
  - name: envoy-external-lb
    group: services
    url: tcp://192.168.100.6:443
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: envoy-internal-lb
    group: services
    url: tcp://192.168.100.7:443
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: k8s-gateway-lb
    group: services
    url: 192.168.100.8:53
    interval: 1m
    dns:
      query-name: plex.igas.dev
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 192.168.100.6"

  - name: kube-api-lb
    group: services
    url: tcp://192.168.100.9:6443
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: mosquitto-lb
    group: services
    url: tcp://192.168.100.124:1883
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: postgres-lb
    group: services
    url: tcp://192.168.100.125:5432
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: plex-lb
    group: services
    url: tcp://192.168.100.210:32400
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/175652
  link: https://github.com/igas
  buttons:
    - name: Github
      link: https://github.com/igas
    - name: Homelab
      link: https://github.com/igas/home-ops

web:
  port: ${GATUS_WEB_PORT}

---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "192.168.6.0/24"
  # Unlabeled Services stay on the legacy pool during the migration.
  serviceSelector:
    matchExpressions:
      - { key: igas.dev/lb-pool, operator: NotIn, values: [bgp] }
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: bgp
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "192.168.100.0/24"
  serviceSelector:
    matchLabels:
      igas.dev/lb-pool: bgp
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Keep this selector identical to the legacy pool's selector. Moving a
  # Service requires both its new IP annotation and igas.dev/lb-pool: bgp.
  serviceSelector:
    matchExpressions:
      - { key: igas.dev/lb-pool, operator: NotIn, values: [bgp] }
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisement-config
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: ["never-used-value"] }
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: bgp-peer-config-v4
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: instance-64514
      localASN: 64514
      peers:
        - name: peer-64513-v4
          peerASN: 64513
          peerAddress: 192.168.1.1
          peerConfigRef:
            name: bgp-peer-config-v4
---
apiVersion: v1
kind: Service
metadata:
  name: kube-api
  annotations:
    external-dns.kubernetes.io/hostname: k8s.igas.dev
    lbipam.cilium.io/ips: 192.168.6.9
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    k8s-app: kube-apiserver
    tier: control-plane
  ports:
    - port: 6443

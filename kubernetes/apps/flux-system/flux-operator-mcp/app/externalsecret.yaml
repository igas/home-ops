---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: flux-operator-mcp-secret
    template:
      # Envoy API-key auth reads every key in the Secret as a client ID and its
      # value as that client's API key.
      data:
        claude-code: "{{ .FLUX_MCP_API_KEY }}"
  dataFrom:
    - extract:
        key: flux-operator-mcp

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator-mcp
  interval: 1h
  values:
    transport: http
    # The chart binds its ServiceAccount to cluster-admin; read-only mode
    # strips the mutating tools and is the only thing making that acceptable.
    readonly: true
    networkPolicy:
      create: true
      # The chart always admits flux-system; add network, where the Envoy
      # proxies run. Every other namespace stays denied.
      ingress:
        namespaces:
          - network
    # API-key auth on this route comes from the SecurityPolicy alongside.
    httpRoute:
      enabled: true
      hostnames:
        - flux-mcp.igas.dev
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    extraArgs:
      - --mask-secrets=true

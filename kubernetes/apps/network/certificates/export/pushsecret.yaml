---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: igas-dev-tls
spec:
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: igas-dev-tls
  template:
    data:
      tls.crt: '{{ index . "tls.crt" | b64enc }}'
      tls.key: '{{ index . "tls.key" | b64enc }}'
  # One 1Password item per key: two back-to-back updates to the same item
  # make Connect reject the second with a 400 (stale item version).
  data:
    - match:
        secretKey: &key tls.crt
        remoteRef:
          remoteKey: igas-dev-tls-crt
          property: *key
    - match:
        secretKey: &key tls.key
        remoteRef:
          remoteKey: igas-dev-tls-key
          property: *key

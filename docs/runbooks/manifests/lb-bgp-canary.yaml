---
# Applied manually for #821, not included in Flux. Delete after both LAN tests.
apiVersion: v1
kind: Namespace
metadata:
  name: lb-bgp-canary
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server
  namespace: lb-bgp-canary
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import time

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok\n")
                return
            if self.path != "/stream":
                self.send_error(404)
                return
            self.send_response(200)
            self.send_header("Content-Type", "application/octet-stream")
            self.send_header("Content-Length", str(60 * 65536))
            self.end_headers()
            for _ in range(60):
                self.wfile.write(b"x" * 65536)
                self.wfile.flush()
                time.sleep(0.5)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: lb-bgp-canary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lb-bgp-canary
  template:
    metadata:
      labels:
        app: lb-bgp-canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: docker.io/library/python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
          command: [python3, -u, -B, /app/server.py]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: server
---
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: lb-bgp-canary
  labels:
    igas.dev/lb-pool: bgp
  annotations:
    lbipam.cilium.io/ips: 192.168.100.254
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: lb-bgp-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
